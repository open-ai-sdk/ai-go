name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  conformance:
    name: AI SDK v7 conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Vite+ and Bun
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: "0.2.6"
          node-version: "24.18.1"
          working-directory: conformance
          cache: true
          run-install: false

      - name: Install conformance dependencies
        run: vp install --frozen-lockfile
        working-directory: conformance

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
        working-directory: conformance

      - name: Run schema, semantic, and live-server gates
        run: bun run test
        working-directory: conformance

      - name: Type-check conformance harness
        run: bun run typecheck
        working-directory: conformance

      - name: Check conformance formatting and lint
        run: bun run check
        working-directory: conformance

      - name: Run useChat browser conformance
        run: bun run test:browser
        working-directory: conformance

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Enforce aikit leaf boundary
        run: |
          deps="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./aikit/... \
            | grep -v '^$' \
            | grep -v '^github.com/open-ai-sdk/ai-go/aikit$' || true)"
          test -z "$deps" || {
            echo "aikit must depend only on the Go standard library:"
            echo "$deps"
            exit 1
          }

      - name: Enforce transport leaf boundary
        run: |
          deps="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./transport/... \
            | grep -v '^$' \
            | grep -v '^github.com/open-ai-sdk/ai-go/aikit$' \
            | grep -v '^github.com/open-ai-sdk/ai-go/transport$' || true)"
          test -z "$deps" || {
            echo "transport must depend only on aikit and the Go standard library:"
            echo "$deps"
            exit 1
          }

      - name: Enforce provider dependency boundary
        run: |
          forbidden="$(go list -deps ./provider/... \
            | grep -E '^github.com/open-ai-sdk/ai-go/(ai|agent|aisdk)(/|$)' || true)"
          test -z "$forbidden" || {
            echo "providers must not depend on ai, agent, or aisdk:"
            echo "$forbidden"
            exit 1
          }

      - name: Verify external consumer surface
        run: go -C compat-test test ./...
