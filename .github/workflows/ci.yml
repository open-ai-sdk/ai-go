name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./... -count=1

      - name: Compat test (external consumer of the public surface)
        run: cd compat-test && go test ./... -count=1

  conformance:
    name: Conformance (real AI SDK v7 client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: conformance/pnpm-lock.yaml

      # The committed fixtures must match what the constructors produce. A Go-side
      # chunk change that forgets to regenerate them fails here, before the TS suite
      # gets a chance to pass against stale bytes.
      - name: Fixtures are up to date
        run: go test ./aisdk/ -run TestConformanceFixtures -count=1

      - name: Install conformance deps
        run: cd conformance && pnpm install --frozen-lockfile

      # The crypto vectors are generated from the TypeScript reference. If the generator
      # and the committed vectors disagree, the Go tests are matching a stale expectation
      # — which is exactly the "both suites green, both wrong" failure the two-directional
      # check exists to prevent.
      - name: Crypto vectors are up to date
        run: |
          cd conformance && node scripts/generate-crypto-vectors.mjs
          cd .. && git diff --exit-code -- aisdk/testdata/canonical-vectors.json \
                                            aisdk/testdata/approval-vectors.json

      # The real ai@7.0.35 client over Go-produced SSE: its own Zod schema (layer 1)
      # and its own stream processor (layer 2), plus the TypeScript half of the crypto
      # vectors. This is what makes a Go change that breaks conformance fail the build.
      - name: Conformance suite
        run: cd conformance && pnpm test

  boundaries:
    name: Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The agentic API does not exist below v0.9.0-beta.1, and every ref/eino line
      # number the design cites was read at v0.9.13. A drifted pin invalidates them
      # silently, so fail loudly here.
      - name: Eino version pin
        run: |
          got=$(go list -m github.com/cloudwego/eino)
          echo "$got"
          test "$got" = "github.com/cloudwego/eino v0.9.13"

      # aisdk is the protocol layer. A consumer importing only aisdk must never
      # compile an agent framework or a router.
      - name: aisdk imports neither Eino nor Gin
        run: |
          deps=$(go list -deps ./aisdk/...)
          ! echo "$deps" | grep -qE 'cloudwego/eino|gin-gonic/gin'

      # Widening the shipped Eino surface should be a review event, not a drive-by import.
      #
      # Test files are excluded: a test for the adapter cannot avoid naming Eino types, and
      # it ships nothing. Including them would mean every new test file needed an allowlist
      # entry, which trains people to edit the list without reading it — the opposite of
      # what the gate is for.
      - name: einoadapter Eino-import allowlist
        run: |
          actual=$(grep -rl 'cloudwego/eino' einoadapter --include='*.go' \
                     | grep -v '_test\.go$' | sort)
          expected=$(grep -v '^#' einoadapter/.eino-imports-allowlist | grep -v '^$' | sort)
          diff <(echo "$expected") <(echo "$actual")

      # The whole point of the reset: this adapter must not re-grow into an SDK.
      #
      # Two exclusions, both deliberate. Tests are excluded because counting them would
      # create pressure to delete the safety net. Comment and blank lines are excluded
      # because the budget is about code volume, and the project rules ask for comments
      # that explain invariants and trade-offs — measuring raw `wc -l` would tax exactly
      # the thing those rules require. (Line comments and blanks only; no file here uses
      # block comments, and adding one would show up as a jump rather than hide anything.)
      - name: Non-test code-line budget
        run: |
          files=$(find . -name '*.go' -not -name '*_test.go' \
                    -not -path './examples/*' -not -path './compat-test/*')
          total=$(echo "$files" | xargs cat | wc -l | tr -d ' ')
          code=$(echo "$files" | xargs grep -hvE '^[[:space:]]*(//|$)' | wc -l | tr -d ' ')
          echo "non-test lines: $total total, $code code (budget 5500 code lines)"
          test "$code" -lt 5500
