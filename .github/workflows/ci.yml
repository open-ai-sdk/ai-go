name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  conformance:
    name: AI SDK v7 conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install conformance dependencies
        run: bun install --frozen-lockfile
        working-directory: conformance

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: conformance

      - name: Run schema, semantic, and live-server gates
        run: bun run test
        working-directory: conformance

      - name: Type-check conformance harness
        run: bun run typecheck
        working-directory: conformance

      - name: Check conformance formatting and lint
        run: bun run check
        working-directory: conformance

      - name: Run useChat browser conformance
        run: bun run test:browser
        working-directory: conformance

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify
