name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  BUN_VERSION: "1.3.13"

jobs:
  conformance:
    name: AI SDK v7 conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: "0.2.6"
          node-version: "24.18.1"
          working-directory: conformance
          cache: true
          run-install: false

      - name: Install conformance dependencies
        run: bun install --frozen-lockfile
        working-directory: conformance

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
        working-directory: conformance

      - name: Run schema, semantic, and live-server gates
        run: bun run test
        working-directory: conformance

      - name: Type-check conformance harness
        run: bun run typecheck
        working-directory: conformance

      - name: Check conformance formatting and lint
        run: bun run check
        working-directory: conformance

      - name: Run useChat browser conformance
        run: bun run test:browser
        working-directory: conformance

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  boundaries:
    name: Structural boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Enforce aikit leaf boundary
        run: |
          deps="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./aikit/... \
            | grep -v '^$' \
            | grep -v '^github.com/open-ai-sdk/ai-go/aikit$' || true)"
          test -z "$deps" || {
            echo "aikit must depend only on the Go standard library:"
            echo "$deps"
            exit 1
          }

      - name: Enforce transport leaf boundary
        run: |
          deps="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./transport/... \
            | grep -v '^$' \
            | grep -v '^github.com/open-ai-sdk/ai-go/aikit$' \
            | grep -v '^github.com/open-ai-sdk/ai-go/transport$' || true)"
          test -z "$deps" || {
            echo "transport must depend only on aikit and the Go standard library:"
            echo "$deps"
            exit 1
          }

      - name: Enforce AI SDK wire boundary
        run: |
          forbidden="$(go list -deps ./aisdk/... \
            | grep -E '^github.com/open-ai-sdk/ai-go/(agent|provider|transport)(/|$)' || true)"
          test -z "$forbidden" || {
            echo "aisdk must not depend on agent, provider, or transport:"
            echo "$forbidden"
            exit 1
          }

      - name: Enforce provider dependency boundary
        run: |
          forbidden="$(go list -deps ./provider/... \
            | grep -E '^github.com/open-ai-sdk/ai-go/(ai|agent|aisdk)(/|$)' || true)"
          test -z "$forbidden" || {
            echo "providers must not depend on ai, agent, or aisdk:"
            echo "$forbidden"
            exit 1
          }

      - name: Enforce agent dependency boundary
        run: |
          test ! -d internal/engine || {
            echo "internal/engine must remain promoted to the public agent package"
            exit 1
          }
          forbidden="$(go list -deps ./agent/... \
            | grep -E '^github.com/open-ai-sdk/ai-go/(ai|aisdk|provider)(/|$)' || true)"
          test -z "$forbidden" || {
            echo "agent must not depend on ai, aisdk, or provider packages:"
            echo "$forbidden"
            exit 1
          }

      - name: Enforce facade direction
        run: |
          importers="$(go list -f '{{$pkg := .ImportPath}}{{range .Imports}}{{if eq . "github.com/open-ai-sdk/ai-go/ai"}}{{$pkg}}{{end}}{{end}}' ./... \
            | grep -v '^$' || true)"
          test -z "$importers" || {
            echo "production packages must not import the ai facade:"
            echo "$importers"
            exit 1
          }

      - name: Enforce core dependency exclusions
        run: |
          forbidden="$(grep -E 'github.com/(cloudwego/eino|gin-gonic/gin)' go.mod || true)"
          test -z "$forbidden" || {
            echo "the core module must not depend on Eino or Gin:"
            echo "$forbidden"
            exit 1
          }

      - name: Enforce optional OpenTelemetry package boundary
        run: |
          runtime_otel="$(go list -deps ./agent/... ./ai ./provider/... \
            | grep -E '^(go.opentelemetry.io|github.com/(go-logr|cespare))' || true)"
          test -z "$runtime_otel" || {
            echo "OpenTelemetry imports must remain isolated in the optional otelagent package:"
            echo "$runtime_otel"
            exit 1
          }

      - name: Enforce snake_case Go filenames
        run: |
          kebab="$(find . -path './conformance/node_modules' -prune -o -name '*-*.go' -print)"
          test -z "$kebab" || {
            echo "Go filenames must use snake_case:"
            echo "$kebab"
            exit 1
          }

      - name: Enforce facade-owned type boundary
        run: go run .github/checks/ai_types.go ./ai

      - name: Enforce package documentation
        run: |
          missing=0
          while IFS= read -r directory; do
            if [ ! -f "$directory/doc.go" ]; then
              echo "$directory has Go source but no doc.go"
              missing=1
            fi
          done < <(find . \
            -path './conformance/node_modules' -prune -o \
            -path './.github/checks' -prune -o \
            -type f -name '*.go' -exec dirname '{}' \; | sort -u)
          test "$missing" -eq 0

      - name: Verify external consumer surface
        run: go -C compat-test test ./...

  test:
    name: Build, vet, and race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download dependencies
        run: |
          go mod download
          go -C aisdkgin mod download
          go -C compat-test mod download
          (cd conformance && bun install --frozen-lockfile)

      - name: Build all Go modules
        run: |
          go build ./...
          go -C aisdkgin build ./...
          go -C compat-test build ./...

      - name: Vet all Go modules
        run: |
          go vet ./...
          go -C aisdkgin vet ./...
          go -C compat-test vet ./...

      - name: Run race tests in all Go modules
        run: |
          go test -race ./... -count=1
          go -C aisdkgin test -race ./... -count=1
          go -C compat-test test -race ./... -count=1
