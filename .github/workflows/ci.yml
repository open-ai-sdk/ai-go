name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./... -count=1

      - name: Compat test (external consumer of the public surface)
        run: cd compat-test && go test ./... -count=1

  conformance:
    name: Conformance (real AI SDK v7 client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: conformance/pnpm-lock.yaml

      # The committed fixtures must match what the constructors produce. A Go-side
      # chunk change that forgets to regenerate them fails here, before the TS suite
      # gets a chance to pass against stale bytes.
      - name: Fixtures are up to date
        run: go test ./aisdk/ -run TestConformanceFixtures -count=1

      # The real ai@7.0.35 client over Go-produced SSE: its own Zod schema (layer 1)
      # and its own stream processor (layer 2). This is what makes a Go chunk change
      # that breaks conformance fail the build.
      - name: Conformance suite
        run: cd conformance && pnpm install --frozen-lockfile && pnpm test

  boundaries:
    name: Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The agentic API does not exist below v0.9.0-beta.1, and every ref/eino line
      # number the design cites was read at v0.9.13. A drifted pin invalidates them
      # silently, so fail loudly here.
      - name: Eino version pin
        run: |
          got=$(go list -m github.com/cloudwego/eino)
          echo "$got"
          test "$got" = "github.com/cloudwego/eino v0.9.13"

      # aisdk is the protocol layer. A consumer importing only aisdk must never
      # compile an agent framework or a router.
      - name: aisdk imports neither Eino nor Gin
        run: |
          deps=$(go list -deps ./aisdk/...)
          ! echo "$deps" | grep -qE 'cloudwego/eino|gin-gonic/gin'

      # Widening the Eino surface should be a review event, not a drive-by import.
      - name: einoadapter Eino-import allowlist
        run: |
          actual=$(grep -rl 'cloudwego/eino' einoadapter --include='*.go' | sort)
          expected=$(grep -v '^#' einoadapter/.eino-imports-allowlist | grep -v '^$' | sort)
          diff <(echo "$expected") <(echo "$actual")

      # The whole point of the reset. Tests are deliberately excluded: the budget is
      # about how much non-test code this adapter needs, and counting tests would
      # create pressure to delete the safety net.
      - name: Non-test LOC budget
        run: |
          loc=$(find . -name '*.go' -not -name '*_test.go' \
                  -not -path './examples/*' -not -path './compat-test/*' \
                  | xargs cat | wc -l | tr -d ' ')
          echo "non-test LOC: $loc"
          test "$loc" -lt 5500
